<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Server Monitor</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="dashboard">
    <header class="header">
      <div class="header__left">
        <h1 class="header__title">Server Monitor</h1>
      </div>
      <div class="header__right">
        <button class="update-button" id="update-project" type="button">Обновить проект</button>
        <span class="status-dot" id="status-dot"></span>
        <span class="header__status" id="connection-status">Подключение...</span>
        <span class="header__updated" id="last-updated"></span>
      </div>
    </header>

    <section class="metrics-grid">
      <article class="metric-card" id="card-cpu">
        <div class="metric-card__header">
          <span class="metric-card__icon">CPU</span>
        </div>
        <div class="metric-card__value" id="cpu-value">—</div>
        <div class="progress">
          <div class="progress__bar" id="cpu-bar"></div>
        </div>
        <p class="metric-card__meta" id="cpu-meta">—</p>
      </article>

      <article class="metric-card" id="card-ram">
        <div class="metric-card__header">
          <span class="metric-card__icon">RAM</span>
        </div>
        <div class="metric-card__value" id="ram-value">—</div>
        <div class="progress">
          <div class="progress__bar" id="ram-bar"></div>
        </div>
        <p class="metric-card__meta" id="ram-meta">—</p>
      </article>

      <article class="metric-card" id="card-disk">
        <div class="metric-card__header">
          <span class="metric-card__icon">DISK</span>
        </div>
        <div class="metric-card__value" id="disk-value">—</div>
        <div class="progress">
          <div class="progress__bar" id="disk-bar"></div>
        </div>
        <p class="metric-card__meta" id="disk-meta">—</p>
      </article>

      <article class="metric-card" id="card-media" hidden>
        <div class="metric-card__header">
          <span class="metric-card__icon">MEDIA</span>
        </div>
        <div class="metric-card__value" id="media-value">—</div>
        <div class="progress">
          <div class="progress__bar" id="media-bar"></div>
        </div>
        <p class="metric-card__meta" id="media-meta">—</p>
      </article>

      <article class="metric-card metric-card--info" id="card-uptime">
        <div class="metric-card__header">
          <span class="metric-card__icon">UP</span>
        </div>
        <div class="metric-card__value metric-card__value--large" id="uptime-value">—</div>
      </article>

      <article class="metric-card metric-card--info" id="card-temp">
        <div class="metric-card__header">
          <span class="metric-card__icon">TEMP</span>
        </div>
        <div class="metric-card__value metric-card__value--large" id="temp-value">—</div>
      </article>
    </section>

    <section class="plex-section" id="plex-section">
      <div class="plex-section__header">
        <h2 class="plex-section__title">Plex Media Server</h2>
        <span class="status-badge" id="plex-status-badge">—</span>
      </div>
      <div class="plex-grid" id="plex-grid">
        <div class="plex-stat">
          <span class="plex-stat__label">Сервис</span>
          <span class="plex-stat__value" id="plex-service">plexmediaserver.service</span>
        </div>
        <div class="plex-stat">
          <span class="plex-stat__label">Статус</span>
          <span class="plex-stat__value" id="plex-status">—</span>
        </div>
        <div class="plex-stat">
          <span class="plex-stat__label">Uptime</span>
          <span class="plex-stat__value" id="plex-uptime">—</span>
        </div>
        <div class="plex-stat">
          <span class="plex-stat__label">Веб-интерфейс</span>
          <span class="plex-stat__value" id="plex-web">—</span>
        </div>
        <div class="plex-stat">
          <span class="plex-stat__label">Порт</span>
          <span class="plex-stat__value" id="plex-port">32400</span>
        </div>
        <div class="plex-stat">
          <span class="plex-stat__label">PID</span>
          <span class="plex-stat__value" id="plex-pid">—</span>
        </div>
      </div>
      <p class="plex-empty" id="plex-empty" hidden>Сервис plexmediaserver.service не найден</p>
    </section>

    <section class="docker-section">
      <div class="docker-section__header">
        <h2 class="docker-section__title">Docker контейнеры</h2>
        <span class="docker-section__count" id="docker-count">0</span>
      </div>
      <div class="table-wrap">
        <table class="docker-table">
          <thead>
            <tr>
              <th>Имя</th>
              <th>Статус</th>
              <th>Образ</th>
              <th>ID</th>
            </tr>
          </thead>
          <tbody id="docker-tbody">
            <tr>
              <td colspan="4" class="docker-table__empty">Загрузка...</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="docker-error" id="docker-error" hidden></p>
    </section>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
